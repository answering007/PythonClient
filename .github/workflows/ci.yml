name: ci

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python packages
        run: python -m pip install --upgrade pip numpy pandas

      - name: Restore
        run: dotnet restore PythonClient.sln

      - name: Build
        run: dotnet build PythonClient.sln -c Release --no-restore

      - name: Unit tests (no Python required)
        shell: pwsh
        run: ./scripts/test/Invoke-Tests.ps1 -Category Unit -Configuration Release -NoBuild

      - name: Integration tests (Python + pandas)
        shell: pwsh
        env:
          PYTHONNET_TEST_DLL: ${{ env.pythonLocation }}\python311.dll
        run: ./scripts/test/Invoke-Tests.ps1 -Category Python -Configuration Release -NoBuild -TimeoutSeconds 900

      - name: Smoke checks (no Python required)
        shell: pwsh
        run: ./scripts/smoke/Test-ProviderSmoke.ps1 -Configuration Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pike.PythonClient64
          path: |
            Pike.PythonClient64/bin/Release/Pike.PythonClient64.dll
            Pike.PythonClient64/bin/Release/Pike.PythonClient64.xml
            Pike.PythonClient64/bin/Release/Pike.PythonClient64.pdb
            Pike.PythonClient64/bin/Release/Python.Runtime.dll
